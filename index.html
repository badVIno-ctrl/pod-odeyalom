    <style>
      html, body { margin: 0; height: 100%; background: #0b101c; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      /* Загрузка: Тихон плетёт паутинку (чистый CSS/SVG — виден, пока грузится код игры) */
      #boot-note {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        color: #8c97a8; font: 600 19px/1.4 Georgia, 'Times New Roman', serif; letter-spacing: 0.02em; background: #0b101c;
      }
      #boot-note svg { width: min(46vmin, 300px); height: auto; overflow: visible; }
      #boot-note .spoke { stroke: #cfd6e6; stroke-width: 1.4; stroke-linecap: round; opacity: .75; stroke-dasharray: 120; stroke-dashoffset: 120; animation: weave 0.5s ease-out forwards; }
      #boot-note .spiral { fill: none; stroke: #e8ecf3; stroke-width: 1.3; stroke-linecap: round; opacity: .85; stroke-dasharray: 3746; stroke-dashoffset: 3746; animation: weave 7s 1.6s linear forwards; }
      #boot-note .silk { stroke: #cfd6e6; stroke-width: 1; opacity: .7; }
      #boot-note .spider { animation: bob 2.6s ease-in-out infinite; transform-origin: 150px 0; }
      #boot-note .leg { stroke: #6b4426; stroke-width: 3; stroke-linecap: round; fill: none; }
      @keyframes weave { to { stroke-dashoffset: 0; } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
      @media (prefers-reduced-motion: reduce) { #boot-note .spoke, #boot-note .spiral { animation: none; stroke-dashoffset: 0; } #boot-note .spider { animation: none; } }
      canvas { outline: none; }
      /* Телефон вертикально: просим повернуть (игра 16:9) */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b101c; color: #f3ebdd;
        font: 700 22px/1.4 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 18px; padding: 24px; }
      #rotate img { width: 96px; height: 96px; border-radius: 22px; }
      #rotate .phone { width: 46px; height: 78px; border: 4px solid #f2a65a; border-radius: 10px; animation: turn 2.2s ease-in-out infinite; }
      #rotate small { color: #8c97a8; font-weight: 600; font-size: 16px; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>

      <div id="boot-text">Тихон плетёт паутинку…</div>

    <script>
      // английский текст загрузки, если выбран язык (как в игре: ?lang=en или сохранённый выбор)
      try { var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('pod-odeyalom:lang');
        if (l === 'en') { document.getElementById('boot-text').textContent = 'Tikhon is weaving a web…'; document.documentElement.lang = 'en'; } } catch (e) {}
    </script>
    <div id="game"></div>
    <div id="rotate">
      <img src="icon-192.png" alt="" />
      <div class="phone"></div>
      <div id="rotate-text">Поверни телефон горизонтально</div>
      <small id="rotate-small">«Под одеялом» лучше всего играется в альбомной ориентации</small>
    </div>
    <script>
      try { if (document.documentElement.lang === 'en') {
        document.title = 'Under the Blanket: Five Days of Fever';
        document.getElementById('rotate-text').textContent = 'Turn your phone sideways';
        document.getElementById('rotate-small').textContent = '“Under the Blanket” plays best in landscape';
      } } catch (e) {}
    </script>
    <script type="module" src="/src/main.js"></script>
